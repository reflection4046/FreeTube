<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:sans-serif;background:#111;color:#eee}
#bar{display:flex;gap:6px;padding:8px;position:sticky;top:0;background:#111;z-index:2}
#q{flex:1;padding:10px;border-radius:8px;border:0;font-size:16px}
button{padding:10px 14px;border:0;border-radius:8px;background:#e53935;color:#fff;font-size:16px}
#pw{position:relative;width:100%;padding-top:56.25%;background:#000;display:none}
#pw>div,#pw iframe{position:absolute;inset:0;width:100%;height:100%}
.item{display:flex;gap:10px;padding:8px;align-items:center}
.item img{width:140px;border-radius:6px}
.item div{font-size:14px}
.item small{color:#aaa}
#msg{padding:12px;color:#ffab91}
</style></head><body>
<div id="bar"><input id="q" placeholder="Search YouTube" enterkeyhint="search"><button id="go">Go</button></div>
<div id="pw"><div id="player"></div></div>
<div id="msg"></div>
<div id="list"></div>
<script>
// Paste your YouTube Data API v3 key here
const API_KEY = "YOUR_API_KEY";
let player, pending;
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){ if(pending) play(pending); }
function play(id){
  document.getElementById("pw").style.display = "block";
  if(!window.YT || !YT.Player){ pending = id; return; }
  if(player){ player.loadVideoById(id); return; }
  player = new YT.Player("player",{videoId:id,
    playerVars:{playsinline:1,autoplay:1,origin:location.origin},
    events:{onError:e=>{document.getElementById("msg").innerHTML =
      "This video can't be played here. <a href='https://www.youtube.com/watch?v="+id+"'>Open in YouTube</a>";}}});
}
async function search(){
  const q = document.getElementById("q").value.trim(); if(!q) return;
  const msg = document.getElementById("msg"), list = document.getElementById("list");
  msg.textContent = ""; list.innerHTML = "";
  try{
    const r = await fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=20&q="+encodeURIComponent(q)+"&key="+API_KEY);
    const j = await r.json();
    if(j.error){ msg.textContent = j.error.message; return; }
    j.items.forEach(v=>{
      const d = document.createElement("div"); d.className = "item";
      const t = document.createElement("div");
      const b = document.createElement("b"); b.textContent = v.snippet.title;
      const s = document.createElement("small"); s.textContent = v.snippet.channelTitle;
      t.append(b, document.createElement("br"), s);
      const img = document.createElement("img"); img.src = v.snippet.thumbnails.medium.url;
      d.append(img, t);
      d.onclick = ()=>{ msg.textContent = ""; play(v.id.videoId); window.scrollTo(0,0); };
      list.appendChild(d);
    });
  }catch(e){ msg.textContent = "Network error"; }
}
document.getElementById("go").onclick = search;
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });
</script></body></html>
